name: Telegram bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FREE_CHANNEL_ID: ${{ secrets.FREE_CHANNEL_ID }}
          VIP_CHANNEL_ID: ${{ secrets.VIP_CHANNEL_ID }}
          REF_LINK: ${{ secrets.REF_LINK }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py
